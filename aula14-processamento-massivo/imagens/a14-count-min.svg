<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="360" fill="white"/>
  <text x="30" y="38" font-size="22" fill="#1f4e79">d = 3 linhas × w = 8 colunas; A inserido 3 vezes, B inserido 2 vezes</text>
  <g font-size="16" fill="#666" text-anchor="middle">
    <text x="232" y="78">0</text><text x="302" y="78">1</text><text x="372" y="78">2</text><text x="442" y="78">3</text><text x="512" y="78">4</text><text x="582" y="78">5</text><text x="652" y="78">6</text><text x="722" y="78">7</text>
  </g>
  <g font-size="20" fill="#222"><text x="60" y="122">linha 0</text><text x="60" y="192">linha 1</text><text x="60" y="262">linha 2</text></g>
  <g stroke="#555" stroke-width="1.5" fill="#f2f2f2">
    <rect x="197" y="90" width="70" height="56"/><rect x="267" y="90" width="70" height="56" fill="#d6e6f5"/><rect x="337" y="90" width="70" height="56"/><rect x="407" y="90" width="70" height="56"/><rect x="477" y="90" width="70" height="56"/><rect x="547" y="90" width="70" height="56" fill="#fbe2d0"/><rect x="617" y="90" width="70" height="56"/><rect x="687" y="90" width="70" height="56"/>
    <rect x="197" y="160" width="70" height="56"/><rect x="267" y="160" width="70" height="56"/><rect x="337" y="160" width="70" height="56"/><rect x="407" y="160" width="70" height="56" fill="#e2d4ee"/><rect x="477" y="160" width="70" height="56"/><rect x="547" y="160" width="70" height="56"/><rect x="617" y="160" width="70" height="56"/><rect x="687" y="160" width="70" height="56"/>
    <rect x="197" y="230" width="70" height="56"/><rect x="267" y="230" width="70" height="56"/><rect x="337" y="230" width="70" height="56" fill="#fbe2d0"/><rect x="407" y="230" width="70" height="56"/><rect x="477" y="230" width="70" height="56"/><rect x="547" y="230" width="70" height="56"/><rect x="617" y="230" width="70" height="56" fill="#d6e6f5"/><rect x="687" y="230" width="70" height="56"/>
  </g>
  <g font-size="24" text-anchor="middle" fill="#222">
    <text x="232" y="127">0</text><text x="302" y="127" font-weight="bold">3</text><text x="372" y="127">0</text><text x="442" y="127">0</text><text x="512" y="127">0</text><text x="582" y="127" font-weight="bold">2</text><text x="652" y="127">0</text><text x="722" y="127">0</text>
    <text x="232" y="197">0</text><text x="302" y="197">0</text><text x="372" y="197">0</text><text x="442" y="197" font-weight="bold">5</text><text x="512" y="197">0</text><text x="582" y="197">0</text><text x="652" y="197">0</text><text x="722" y="197">0</text>
    <text x="232" y="267">0</text><text x="302" y="267">0</text><text x="372" y="267" font-weight="bold">2</text><text x="442" y="267">0</text><text x="512" y="267">0</text><text x="582" y="267">0</text><text x="652" y="267" font-weight="bold">3</text><text x="722" y="267">0</text>
  </g>
  <text x="775" y="197" font-size="18" fill="#6a3d9a">← A e B colidem</text>
  <text x="30" y="330" font-size="22" fill="#222"><tspan fill="#2e75b6" font-weight="bold">A</tspan> = min(3, 5, 3) = 3</text>
  <text x="300" y="330" font-size="22" fill="#222"><tspan fill="#c55a11" font-weight="bold">B</tspan> = min(2, 5, 2) = 2</text>
  <text x="570" y="330" font-size="22" fill="#555">cada contador ≥ contagem real</text>
</svg>
